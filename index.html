<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản đồ 3D Đa Nền Tảng</title>
    
    <!-- MapLibre GL JS (Engine 3D WebGL) -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
        }

        /* KHUNG TÌM KIẾM ĐỊA ĐIỂM */
        #search-bar-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 420px;
            max-width: 85vw;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(30, 30, 47, 0.88) 0%, rgba(42, 42, 64, 0.88) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            padding: 6px 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .search-icon { color: #00d2ff; font-size: 16px; margin-right: 10px; }

        #global-search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            padding: 8px 0;
        }

        #clear-search-btn { background: transparent; border: none; color: #a0a0b5; cursor: pointer; }

        .global-autocomplete-box {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: rgba(30, 30, 47, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 20;
            margin-top: 8px;
            display: none;
        }

        /* NÚT ĐIỀU KHIỂN HƯỚNG BẮC & TILT 3D */
        #controls-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .custom-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(30, 30, 47, 0.88) 0%, rgba(42, 42, 64, 0.88) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #00d2ff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #compass-icon { transition: transform 0.1s linear; }

        /* PANEL DẪN ĐƯỜNG */
        #routing-panel {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 10;
            background: linear-gradient(135deg, rgba(30, 30, 47, 0.88) 0%, rgba(42, 42, 64, 0.88) 100%);
            padding: 16px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            width: 300px;
            color: #ffffff;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .panel-header { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .panel-header i {
            font-size: 18px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .panel-header h3 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
        .toggle-icon { display: none; color: #a0a0b5; font-size: 14px; }
        .panel-body { margin-top: 14px; }

        .input-group { position: relative; margin-bottom: 10px; display: flex; align-items: center; }
        .input-group i { position: absolute; left: 12px; font-size: 14px; z-index: 2; }
        .icon-start { color: #00e676; }
        .icon-end { color: #ff5252; }

        .input-group input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        .autocomplete-box {
            position: absolute;
            bottom: 100%; left: 0; right: 0;
            background: rgba(37, 37, 56, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 20;
            margin-bottom: 6px;
            display: none;
        }

        .autocomplete-item {
            padding: 10px 12px;
            font-size: 12px;
            color: #e0e0e0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .button-group { display: flex; gap: 8px; margin-top: 12px; }
        .button-group button {
            flex: 1; padding: 9px; border: none; border-radius: 10px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        #route-btn { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
        #clear-btn { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; }

        .info-card {
            margin-top: 12px; padding: 10px;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px; font-size: 12px; text-align: center; color: #ffffff;
        }

        /* ĐỒNG HỒ THỜI GIAN THỰC */
        #glass-clock-container {
            position: absolute;
            bottom: 25px;
            left: 345px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(30, 30, 47, 0.88) 0%, rgba(42, 42, 64, 0.88) 100%);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            color: #ffffff;
        }
        .clock-icon {
            font-size: 22px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #clock-time { font-size: 18px; font-weight: 700; }
        #clock-date { font-size: 11px; color: #a0a0b5; margin-top: 2px; }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            #search-bar-container { top: 12px; left: 15px; transform: none; width: calc(100% - 80px); }
            #controls-container { top: 12px; right: 12px; }
            #glass-clock-container { display: none; }
            #routing-panel { bottom: 12px; left: 12px; right: 12px; width: auto; }
            .toggle-icon { display: block; }
            #routing-panel.panel-collapsed .panel-body { display: none; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- KHUNG TÌM KIẾM ĐỊA ĐIỂM -->
    <div id="search-bar-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="global-search-input" placeholder="Tìm kiếm địa điểm..." autocomplete="off" oninput="debounceGlobalSearch()" />
        <button id="clear-search-btn" onclick="clearGlobalSearch()" style="display: none;">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="global-search-results" class="global-autocomplete-box"></div>
    </div>

    <!-- BỘ NÚT ĐIỀU KHIỂN BẢN ĐỒ 3D -->
    <div id="controls-container">
        <button class="custom-btn" title="Đặt lại hướng Bắc (0°)" onclick="resetMapBearing()">
            <i class="fa-solid fa-compass" id="compass-icon"></i>
        </button>
        <button class="custom-btn" title="Bật/Tắt chế độ nghiêng 3D" onclick="toggle3DTilt()">
            3D
        </button>
    </div>

    <!-- PANEL DẪN ĐƯỜNG -->
    <div id="routing-panel" class="panel-collapsed">
        <div class="panel-header" onclick="toggleRoutingPanel()">
            <i class="fa-solid fa-route"></i>
            <h3>Dẫn Đường 3D</h3>
            <i class="fa-solid fa-chevron-up toggle-icon" id="panel-toggle-btn"></i>
        </div>
        
        <div class="panel-body">
            <div class="input-group">
                <i class="fa-solid fa-circle-dot icon-start"></i>
                <input type="text" id="start-input" placeholder="Nhập điểm đón (A)..." autocomplete="off" oninput="debounceSearch('start')" />
                <div id="start-results" class="autocomplete-box"></div>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-location-dot icon-end"></i>
                <input type="text" id="end-input" placeholder="Nhập điểm đến (B)..." autocomplete="off" oninput="debounceSearch('end')" />
                <div id="end-results" class="autocomplete-box"></div>
            </div>

            <div class="button-group">
                <button id="route-btn" onclick="calculateRoute()">
                    <i class="fa-solid fa-paper-plane"></i> Tìm Đường
                </button>
                <button id="clear-btn" onclick="clearRoute()">
                    <i class="fa-solid fa-rotate-left"></i> Xóa
                </button>
            </div>

            <div id="route-info" class="info-card" style="display: none;"></div>
        </div>
    </div>

    <!-- ĐỒNG HỒ GLASS DESIGN -->
    <div id="glass-clock-container">
        <div class="clock-icon"><i class="fa-regular fa-clock"></i></div>
        <div class="clock-content">
            <div id="clock-time">00:00:00</div>
            <div id="clock-date">Thứ ..., --/--/----</div>
        </div>
    </div>

    <script>
        // CẤU HÌNH KHOẢNG BẢN ĐỒ 3D
        var map = new maplibregl.Map({
            container: 'map',
            style: {
                'version': 8,
                'sources': {
                    'raster-tiles': {
                        'type': 'raster',
                        'tiles': ['https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}'],
                        'tileSize': 256,
                        'maxzoom': 20
                    }
                },
                'layers': [{
                    'id': 'google-tiles',
                    'type': 'raster',
                    'source': 'raster-tiles',
                    'minzoom': 0,
                    'maxzoom': 20
                }]
            },
            center: [108.206230, 16.047079], // [Lng, Lat]
            zoom: 6,
            pitch: 60, // Độ nghiêng 3D khởi tạo
            bearing: 0, // Góc xoay ban đầu
            antialias: true
        });

        // Thêm bộ điều khiển điều hướng chuẩn MapLibre
        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');
        map.addControl(new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true
        }), 'top-left');

        // Cập nhật góc kim la bàn khi bản đồ xoay
        map.on('rotate', function() {
            var bearing = map.getBearing();
            var compass = document.getElementById('compass-icon');
            if (compass) {
                compass.style.transform = `rotate(${-bearing}deg)`;
            }
        });

        function resetMapBearing() {
            map.easeTo({ bearing: 0, pitch: 0, duration: 1000 });
        }

        function toggle3DTilt() {
            var currentPitch = map.getPitch();
            var newPitch = currentPitch > 10 ? 0 : 60;
            map.easeTo({ pitch: newPitch, duration: 800 });
        }

        /* ĐỒNG HỒ THỜI GIAN THỰC */
        function updateClock() {
            var now = new Date();
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;

            var days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            var dayName = days[now.getDay()];
            var date = String(now.getDate()).padStart(2, '0');
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var year = now.getFullYear();
            document.getElementById('clock-date').innerText = `${dayName}, ${date}/${month}/${year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* TOGGLE PANEL MOBILE */
        function toggleRoutingPanel() {
            if (window.innerWidth <= 768) {
                var panel = document.getElementById('routing-panel');
                var icon = document.getElementById('panel-toggle-btn');
                if (panel.classList.contains('panel-collapsed')) {
                    panel.classList.remove('panel-collapsed');
                    icon.className = "fa-solid fa-chevron-down toggle-icon";
                } else {
                    panel.classList.add('panel-collapsed');
                    icon.className = "fa-solid fa-chevron-up toggle-icon";
                }
            }
        }

        /* DẪN ĐƯỜNG VÀ TÌM KIẾM ĐỊA ĐIỂM */
        var startMarker = null, endMarker = null, searchMarker = null;
        var startCoords = null, endCoords = null;
        var globalSearchTimer = null, searchTimer = null;

        function debounceGlobalSearch() {
            clearTimeout(globalSearchTimer);
            var query = document.getElementById('global-search-input').value;
            var clearBtn = document.getElementById('clear-search-btn');

            if (query.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
                document.getElementById('global-search-results').style.display = 'none';
                return;
            }

            globalSearchTimer = setTimeout(() => {
                if (query.length < 2) return;
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=vn&limit=5`)
                    .then(res => res.json())
                    .then(data => {
                        var box = document.getElementById('global-search-results');
                        box.innerHTML = '';
                        if (data.length > 0) {
                            box.style.display = 'block';
                            data.forEach(item => {
                                var div = document.createElement('div');
                                div.className = 'autocomplete-item';
                                div.innerText = item.display_name;
                                div.onclick = function() {
                                    goToLocation(parseFloat(item.lon), parseFloat(item.lat), item.display_name);
                                    box.style.display = 'none';
                                };
                                box.appendChild(div);
                            });
                        } else { box.style.display = 'none'; }
                    });
            }, 300);
        }

        function goToLocation(lng, lat, label) {
            if (searchMarker) searchMarker.remove();
            searchMarker = new maplibregl.Marker({ color: '#00d2ff' })
                .setLngLat([lng, lat])
                .setPopup(new maplibregl.Popup().setHTML(`<b>${label}</b>`))
                .addTo(map);
            map.flyTo({ center: [lng, lat], zoom: 15, pitch: 50, duration: 1500 });
        }

        function clearGlobalSearch() {
            document.getElementById('global-search-input').value = '';
            document.getElementById('clear-search-btn').style.display = 'none';
            document.getElementById('global-search-results').style.display = 'none';
            if (searchMarker) searchMarker.remove();
        }

        function debounceSearch(type) {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                var query = document.getElementById(type + '-input').value;
                if (query.length < 2) {
                    document.getElementById(type + '-results').style.display = 'none';
                    return;
                }
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=vn&limit=5`)
                    .then(res => res.json())
                    .then(data => {
                        var box = document.getElementById(type + '-results');
                        box.innerHTML = '';
                        if (data.length > 0) {
                            box.style.display = 'block';
                            data.forEach(item => {
                                var div = document.createElement('div');
                                div.className = 'autocomplete-item';
                                div.innerText = item.display_name;
                                div.onclick = function() {
                                    if (type === 'start') {
                                        setStartPoint(parseFloat(item.lon), parseFloat(item.lat), item.display_name);
                                    } else {
                                        setEndPoint(parseFloat(item.lon), parseFloat(item.lat), item.display_name);
                                    }
                                    box.style.display = 'none';
                                };
                                box.appendChild(div);
                            });
                        } else { box.style.display = 'none'; }
                    });
            }, 300);
        }

        function setStartPoint(lng, lat, label) {
            if (startMarker) startMarker.remove();
            startCoords = [lng, lat];
            startMarker = new maplibregl.Marker({ color: '#00e676' })
                .setLngLat([lng, lat])
                .addTo(map);
            document.getElementById('start-input').value = label;
        }

        function setEndPoint(lng, lat, label) {
            if (endMarker) endMarker.remove();
            endCoords = [lng, lat];
            endMarker = new maplibregl.Marker({ color: '#ff5252' })
                .setLngLat([lng, lat])
                .addTo(map);
            document.getElementById('end-input').value = label;
        }

        // TÍNH TOÁN ĐƯỜNG ĐI DẪN ĐƯỜNG 3D
        function calculateRoute() {
            var infoCard = document.getElementById('route-info');
            if (!startCoords || !endCoords) {
                infoCard.style.display = 'block';
                infoCard.innerHTML = "<span style='color: #ff5252;'>Vui lòng chọn đủ Điểm đón & Điểm đến!</span>";
                return;
            }

            var osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startCoords[0]},${startCoords[1]};${endCoords[0]},${endCoords[1]}?overview=full&geometries=geojson`;

            infoCard.style.display = 'block';
            infoCard.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Đang tính toán đường đi...";

            fetch(osrmUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        var route = data.routes[0];
                        var routeGeojson = {
                            'type': 'Feature',
                            'geometry': route.geometry
                        };

                        if (map.getSource('route')) {
                            map.getSource('route').setData(routeGeojson);
                        } else {
                            map.addSource('route', { 'type': 'geojson', 'data': routeGeojson });
                            map.addLayer({
                                'id': 'route',
                                'type': 'line',
                                'source': 'route',
                                'layout': { 'line-join': 'round', 'line-cap': 'round' },
                                'paint': { 'line-color': '#00d2ff', 'line-width': 6, 'line-opacity': 0.85 }
                            });
                        }

                        var distKm = (route.distance / 1000).toFixed(2);
                        infoCard.innerHTML = `<i class="fa-solid fa-road"></i> Khoảng cách: <b>${distKm} km</b>`;
                    } else {
                        infoCard.innerHTML = "<span style='color: #ff5252;'>Không tìm thấy đường đi thích hợp!</span>";
                    }
                });
        }

        function clearRoute() {
            if (startMarker) startMarker.remove();
            if (endMarker) endMarker.remove();
            if (map.getLayer('route')) map.removeLayer('route');
            if (map.getSource('route')) map.removeSource('route');
            startCoords = null; endCoords = null;
            document.getElementById('start-input').value = '';
            document.getElementById('end-input').value = '';
            document.getElementById('route-info').style.display = 'none';
        }

        // Chọn điểm trực tiếp bằng cách Click vào bản đồ
        map.on('click', function(e) {
            var coords = [e.lngLat.lng, e.lngLat.lat];
            if (!startCoords) {
                setStartPoint(coords[0], coords[1], "Điểm chọn trên bản đồ");
            } else if (!endCoords) {
                setEndPoint(coords[0], coords[1], "Điểm chọn trên bản đồ");
                calculateRoute();
            }
        });
    </script>
</body>
</html>
